<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body, html {
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #fff;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        #wrapper {
            position: relative;
            width: 100%;
            height: 100%;
        }

        video {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            background: #000;
        }

        /* ── Loader ── */
        #loader {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            transition: opacity 0.25s;
            z-index: 10;
        }
        #loader.hidden { opacity: 0; }
        .spinner {
            width: 48px; height: 48px;
            border: 3px solid rgba(255,255,255,0.15);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Skip flash ── */
        .skip-flash {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.2s;
            z-index: 15;
        }
        .skip-flash.show { opacity: 1; }
        .skip-flash i    { font-size: 38px; filter: drop-shadow(0 1px 4px rgba(0,0,0,0.6)); }
        .skip-flash span { font-size: 13px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
        #skip-back { left: 12%; }
        #skip-fwd  { right: 12%; }

        /* ── Error overlay ── */
        #error-overlay {
            position: absolute; inset: 0;
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 12px; background: rgba(0,0,0,0.88);
            text-align: center; padding: 32px; z-index: 50;
        }
        #error-overlay.visible { display: flex; }
        .ov-icon { font-size: 44px; color: rgba(255,255,255,0.4); }
        #error-msg { font-size: 15px; color: rgba(255,255,255,0.75); max-width: 260px; line-height: 1.55; }
        #retry-btn {
            margin-top: 4px; padding: 9px 24px;
            border-radius: 8px; border: none;
            background: #e50914; color: #fff;
            font-size: 14px; font-weight: 600;
            cursor: pointer; touch-action: manipulation;
        }

        /* ── No-data ── */
        #no-data {
            position: absolute; inset: 0;
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 12px; z-index: 50;
        }
        #no-data.visible { display: flex; }
        #no-data span { font-size: 15px; color: rgba(255,255,255,0.5); }

        /* ── Controls ── */
        #controls {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 0 0 8px;
            background: linear-gradient(transparent, rgba(0,0,0,0.85) 55%);
            opacity: 0;
            transition: opacity 0.3s;
            z-index: 20;
        }
        #controls.visible { opacity: 1; }

        /* Progress */
        #progress-wrap {
            padding: 14px 12px 8px;
            cursor: pointer;
            touch-action: none;
        }
        #progress-track {
            height: 3px;
            background: rgba(255,255,255,0.22);
            border-radius: 2px;
            position: relative;
            transition: height 0.15s;
        }
        #controls:hover #progress-track { height: 5px; }

        #progress-buf {
            position: absolute; left: 0; top: 0; height: 100%;
            background: rgba(255,255,255,0.28);
            border-radius: 2px; width: 0%;
        }
        #progress-fill {
            position: absolute; left: 0; top: 0; height: 100%;
            background: #e50914; border-radius: 2px; width: 0%;
        }
        #progress-thumb {
            position: absolute; top: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 14px; height: 14px;
            background: #fff; border-radius: 50%;
            left: 0%; pointer-events: none;
            transition: transform 0.15s;
        }
        #controls:hover #progress-thumb { transform: translate(-50%, -50%) scale(1); }

        /* Button row */
        #btn-row {
            display: flex;
            align-items: center;
            padding: 0 4px 0;
            gap: 0;
            min-height: 44px;
        }

        .ctrl-btn {
            background: none; border: none; color: #fff;
            cursor: pointer;
            min-width: 40px; height: 40px;
            padding: 0 6px;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; line-height: 1;
            touch-action: manipulation;
            transition: background 0.12s;
            flex-shrink: 0;
        }
        .ctrl-btn:hover  { background: rgba(255,255,255,0.1); }
        .ctrl-btn:active { background: rgba(255,255,255,0.2); }

        #btn-back,
        #btn-fwd { display: none; }

        #time-display {
            font-size: 12px;
            color: rgba(255,255,255,0.85);
            white-space: nowrap;
            padding: 0 6px;
            flex-shrink: 0;
        }

        .spacer { flex: 1; min-width: 8px; }

        /* Volume */
        #vol-wrap {
            display: flex; align-items: center;
            flex-shrink: 0;
        }
        #vol-slider-wrap {
            width: 0; overflow: hidden;
            transition: width 0.25s;
            display: flex; align-items: center;
        }
        #vol-wrap:hover #vol-slider-wrap { width: 72px; }
        #vol-slider {
            -webkit-appearance: none; appearance: none;
            width: 68px; height: 3px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px; outline: none;
            cursor: pointer; accent-color: #e50914;
        }
        #vol-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 13px; height: 13px;
            border-radius: 50%; background: #fff; cursor: pointer;
        }
        #vol-slider::-moz-range-thumb {
            width: 13px; height: 13px;
            border-radius: 50%; background: #fff; border: none; cursor: pointer;
        }

        /* Quality button */
        #quality-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.18);
            color: #fff; cursor: pointer;
            padding: 5px 10px; border-radius: 6px;
            font-size: 12px; font-weight: 700;
            letter-spacing: 0.04em;
            touch-action: manipulation;
            transition: background 0.12s, border-color 0.12s;
            white-space: nowrap; flex-shrink: 0;
            display: flex; align-items: center; gap: 4px;
            height: 30px;
        }
        #quality-btn:hover { background: rgba(255,255,255,0.2); }
        #quality-btn.open  { background: #e50914; border-color: #e50914; }
        #quality-btn .q-arrow { font-size: 13px; transition: transform 0.2s; }
        #quality-btn.open .q-arrow { transform: rotate(180deg); }

        /* Quality menu */
        #quality-menu {
            position: absolute;
            bottom: 62px; right: 8px;
            background: rgba(15,15,15,0.97);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; overflow: hidden;
            min-width: 120px;
            display: none; flex-direction: column;
            z-index: 30;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        #quality-menu.open { display: flex; }
        #quality-menu-title {
            font-size: 11px; font-weight: 600;
            color: rgba(255,255,255,0.35);
            letter-spacing: 0.08em; text-transform: uppercase;
            padding: 10px 16px 6px;
        }
        .qm-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; font-size: 14px; font-weight: 500;
            cursor: pointer; touch-action: manipulation;
            border: none; background: none;
            color: rgba(255,255,255,0.65);
            text-align: left; width: 100%;
            transition: background 0.1s, color 0.1s;
        }
        .qm-item:not(:last-child) { border-bottom: 1px solid rgba(255,255,255,0.06); }
        .qm-item:hover  { background: rgba(255,255,255,0.07); color: #fff; }
        .qm-item.active { color: #fff; }
        .qm-check { font-size: 15px; color: #e50914; visibility: hidden; flex-shrink: 0; }
        .qm-item.active .qm-check { visibility: visible; }

        /* Keyboard hint */
        #kb-hint {
            position: absolute;
            bottom: 70px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 13px; color: rgba(255,255,255,0.8);
            pointer-events: none;
            opacity: 0; transition: opacity 0.2s;
            white-space: nowrap; z-index: 25;
        }
        #kb-hint.show { opacity: 1; }
    </style>
</head>
<body>
<div id="wrapper">
    <video id="player" playsinline webkit-playsinline x5-playsinline preload="metadata"></video>

    <div id="loader"><div class="spinner"></div></div>

    <div class="skip-flash" id="skip-back">
        <i class="ti ti-rewind-10"></i>
        <span>−10 сек</span>
    </div>
    <div class="skip-flash" id="skip-fwd">
        <i class="ti ti-forward-10"></i>
        <span>+10 сек</span>
    </div>

    <div id="kb-hint"></div>

    <div id="error-overlay">
        <i class="ov-icon ti ti-alert-triangle" aria-hidden="true"></i>
        <p id="error-msg">Не вдалося завантажити відео</p>
        <button id="retry-btn">Спробувати знову</button>
    </div>

    <div id="no-data">
        <i class="ov-icon ti ti-video-off" aria-hidden="true"></i>
        <span>Відео не знайдено</span>
    </div>

    <div id="quality-menu" role="menu" aria-label="Якість">
        <div id="quality-menu-title">Якість</div>
    </div>

    <div id="controls">
        <div id="progress-wrap" role="slider" aria-label="Прогрес">
            <div id="progress-track">
                <div id="progress-buf"></div>
                <div id="progress-fill"></div>
                <div id="progress-thumb"></div>
            </div>
        </div>
        <div id="btn-row">
            <button class="ctrl-btn" id="btn-play" aria-label="Відтворити">
                <i class="ti ti-player-play-filled"></i>
            </button>
            <button class="ctrl-btn" id="btn-back" aria-label="−10 секунд" title="←  або J">
                <i class="ti ti-rewind-10"></i>
            </button>
            <button class="ctrl-btn" id="btn-fwd" aria-label="+10 секунд" title="→  або L">
                <i class="ti ti-forward-10"></i>
            </button>
            <span id="time-display">0:00 / 0:00</span>
            <div class="spacer"></div>
            <div id="vol-wrap">
                <button class="ctrl-btn" id="btn-mute" aria-label="Звук" title="M">
                    <i class="ti ti-volume"></i>
                </button>
                <div id="vol-slider-wrap">
                    <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="0.15">
                </div>
            </div>
            <button id="quality-btn" aria-label="Якість" aria-haspopup="true" aria-expanded="false">
                <span id="quality-label">—</span>
                <i class="ti ti-chevron-up q-arrow" aria-hidden="true"></i>
            </button>
            <button class="ctrl-btn" id="btn-fs" aria-label="Повний екран" title="F">
                <i class="ti ti-arrows-maximize"></i>
            </button>
        </div>
    </div>
</div>

<script>
(function () {
    const tg = window.Telegram?.WebApp;
    if (tg) {
        tg.expand();
        tg.setHeaderColor('#000000');
        tg.setBackgroundColor('#000000');
    }

    const isTouch = ('ontouchstart' in window) || navigator.maxTouchPoints > 0;

    /* DOM */
    const player        = document.getElementById('player');
    const wrapper       = document.getElementById('wrapper');
    const loader        = document.getElementById('loader');
    const errorOv       = document.getElementById('error-overlay');
    const errorMsg      = document.getElementById('error-msg');
    const retryBtn      = document.getElementById('retry-btn');
    const noData        = document.getElementById('no-data');
    const controls      = document.getElementById('controls');
    const progressWrap  = document.getElementById('progress-wrap');
    const progressFill  = document.getElementById('progress-fill');
    const progressBuf   = document.getElementById('progress-buf');
    const progressThumb = document.getElementById('progress-thumb');
    const btnPlay       = document.getElementById('btn-play');
    const btnBack       = document.getElementById('btn-back');
    const btnFwd        = document.getElementById('btn-fwd');
    const btnMute       = document.getElementById('btn-mute');
    const btnFs         = document.getElementById('btn-fs');
    const volSlider     = document.getElementById('vol-slider');
    const timeDisplay   = document.getElementById('time-display');
    const qualityBtn    = document.getElementById('quality-btn');
    const qualityLabel  = document.getElementById('quality-label');
    const qualityMenu   = document.getElementById('quality-menu');
    const skipBackEl    = document.getElementById('skip-back');
    const skipFwdEl     = document.getElementById('skip-fwd');
    const kbHint        = document.getElementById('kb-hint');

    let hls          = null;
    let qualities    = {};
    let currentLabel = null;
    let uiTimer      = null;
    let menuOpen     = false;
    let scrubbing    = false;
    let kbHintTimer  = null;
    let skipTimers   = {};

    /* ── Parse URL ── */
    const dataParam = new URLSearchParams(window.location.search).get('data');
    if (!dataParam) {
        noData.classList.add('visible');
        loader.classList.add('hidden');
        return;
    }
    try {
        qualities = JSON.parse(atob(dataParam));
        if (!qualities || !Object.keys(qualities).length) throw 0;
    } catch {
        showError('Невірний формат даних');
        return;
    }

    /* ── Quality menu items ── */
    for (const label of Object.keys(qualities)) {
        const item = document.createElement('button');
        item.className = 'qm-item';
        item.dataset.label = label;
        item.setAttribute('role', 'menuitem');
        item.innerHTML = `<i class="ti ti-check qm-check" aria-hidden="true"></i><span>${label}</span>`;
        item.addEventListener('click', (e) => {
            e.stopPropagation();
            loadVideo(label, true);
            closeMenu();
            showControls();
        });
        qualityMenu.appendChild(item);
    }

    /* ── Init ── */
    player.volume = 0.15;
    loadVideo(Object.keys(qualities)[0], false);
    showControls();

    /* ── Load video ── */
    function loadVideo(label, preserveTime) {
        const url = qualities[label];
        if (!url) return;
        const savedTime  = preserveTime ? player.currentTime : 0;
        const wasPlaying = preserveTime && !player.paused;
        currentLabel = label;
        setLoading(true);
        hideError();
        updateQualityUI(label);
        if (hls) { hls.destroy(); hls = null; }
        if (url.includes('.m3u8') && Hls.isSupported()) {
            hls = new Hls({ maxBufferLength: 30, maxMaxBufferLength: 600, enableWorker: true });
            hls.loadSource(url);
            hls.attachMedia(player);
            hls.on(Hls.Events.MANIFEST_PARSED, () => restorePlayback(savedTime, wasPlaying));
            hls.on(Hls.Events.ERROR, (_e, d) => {
                if (d.fatal) showError(d.type === Hls.ErrorTypes.NETWORK_ERROR
                    ? "Помилка мережі. Перевірте з'єднання."
                    : 'Помилка відтворення потоку.');
            });
        } else {
            player.src = url;
            player.addEventListener('loadedmetadata', () => restorePlayback(savedTime, wasPlaying), { once: true });
        }
    }

    function restorePlayback(time, play) {
        if (time > 0) player.currentTime = time;
        if (play) player.play().catch(() => {});
    }

    function updateQualityUI(label) {
        qualityLabel.textContent = label;
        qualityMenu.querySelectorAll('.qm-item').forEach(el =>
            el.classList.toggle('active', el.dataset.label === label)
        );
    }

    /* ── Time format ── */
    function fmt(s) {
        s = Math.floor(s || 0);
        const h   = Math.floor(s / 3600);
        const m   = Math.floor((s % 3600) / 60);
        const sec = String(s % 60).padStart(2, '0');
        return h > 0 ? `${h}:${String(m).padStart(2,'0')}:${sec}` : `${m}:${sec}`;
    }

    /* ── Progress update ── */
    player.addEventListener('timeupdate', () => {
        if (scrubbing) return;
        const pct = player.duration ? (player.currentTime / player.duration) * 100 : 0;
        progressFill.style.width = pct + '%';
        progressThumb.style.left = pct + '%';
        timeDisplay.textContent  = fmt(player.currentTime) + ' / ' + fmt(player.duration);
    });
    player.addEventListener('progress', () => {
        if (!player.duration || !player.buffered.length) return;
        progressBuf.style.width = (player.buffered.end(player.buffered.length - 1) / player.duration * 100) + '%';
    });

    /* ── Scrub ── */
    function scrubAt(clientX) {
        const rect = progressWrap.getBoundingClientRect();
        const pct  = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        if (player.duration) {
            player.currentTime = pct * player.duration;
            progressFill.style.width = (pct * 100) + '%';
            progressThumb.style.left = (pct * 100) + '%';
        }
    }
    progressWrap.addEventListener('mousedown', (e) => {
        e.stopPropagation(); scrubbing = true; scrubAt(e.clientX);
    });
    progressWrap.addEventListener('touchstart', (e) => {
        e.stopPropagation(); scrubbing = true; scrubAt(e.touches[0].clientX);
    }, { passive: true });
    document.addEventListener('mousemove', (e) => { if (scrubbing) scrubAt(e.clientX); });
    progressWrap.addEventListener('touchmove', (e) => {
        if (scrubbing) { e.preventDefault(); scrubAt(e.touches[0].clientX); }
    }, { passive: false });
    document.addEventListener('mouseup',  () => { scrubbing = false; });
    document.addEventListener('touchend', () => { scrubbing = false; });

    /* ── Play / Pause ── */
    function togglePlay() {
        if (player.paused) player.play().catch(() => {});
        else player.pause();
    }
    btnPlay.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
    player.addEventListener('play',  () => { btnPlay.innerHTML = '<i class="ti ti-player-pause-filled"></i>'; });
    player.addEventListener('pause', () => { btnPlay.innerHTML = '<i class="ti ti-player-play-filled"></i>'; });

    /* ── Skip ── */
    function flashSkip(el, key) {
        el.classList.add('show');
        clearTimeout(skipTimers[key]);
        skipTimers[key] = setTimeout(() => el.classList.remove('show'), 700);
    }
    function skipBy(sec) {
        player.currentTime = Math.max(0, Math.min(player.duration || 0, player.currentTime + sec));
        flashSkip(sec < 0 ? skipBackEl : skipFwdEl, sec < 0 ? 'b' : 'f');
        showControls();
    }
    btnBack.addEventListener('click', (e) => { e.stopPropagation(); skipBy(-10); });
    btnFwd .addEventListener('click', (e) => { e.stopPropagation(); skipBy(+10); });

    /* ── Volume ── */
    function updateVolIcon() {
        const v = player.muted || player.volume === 0;
        const icon = v ? 'ti-volume-off' : player.volume < 0.5 ? 'ti-volume-2' : 'ti-volume';
        btnMute.innerHTML = `<i class="ti ${icon}"></i>`;
        volSlider.value = player.muted ? 0 : player.volume;
    }
    btnMute.addEventListener('click', (e) => {
        e.stopPropagation();
        player.muted = !player.muted;
        updateVolIcon();
        showControls();
    });
    volSlider.addEventListener('input', (e) => {
        e.stopPropagation();
        player.volume = +volSlider.value;
        player.muted  = player.volume === 0;
        updateVolIcon();
        showControls();
    });
    volSlider.addEventListener('click',      (e) => e.stopPropagation());
    volSlider.addEventListener('mousedown',  (e) => e.stopPropagation());
    volSlider.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
    player.addEventListener('volumechange', updateVolIcon);
    updateVolIcon();

    /* ── Loader ── */
    function setLoading(on) { loader.classList.toggle('hidden', !on); }
    player.addEventListener('waiting',   () => setLoading(true));
    player.addEventListener('playing',   () => setLoading(false));
    player.addEventListener('canplay',   () => setLoading(false));
    player.addEventListener('loadstart', () => setLoading(true));
    player.addEventListener('error', () => {
        const m = {1:'Завантаження перервано.',2:'Помилка мережі.',3:'Помилка декодування.',4:'Формат не підтримується.'};
        showError(m[player.error?.code] || 'Невідома помилка.');
    });

    /* ── Error ── */
    function showError(msg) { setLoading(false); errorMsg.textContent = msg; errorOv.classList.add('visible'); }
    function hideError()    { errorOv.classList.remove('visible'); }
    retryBtn.addEventListener('click', () => { if (currentLabel) loadVideo(currentLabel, false); });

    /* ── Quality menu ── */
    function openMenu() {
        menuOpen = true;
        qualityMenu.classList.add('open');
        qualityBtn.classList.add('open');
        qualityBtn.setAttribute('aria-expanded', 'true');
    }
    function closeMenu() {
        menuOpen = false;
        qualityMenu.classList.remove('open');
        qualityBtn.classList.remove('open');
        qualityBtn.setAttribute('aria-expanded', 'false');
    }
    qualityBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        menuOpen ? closeMenu() : openMenu();
        showControls();
    });

    /* ── Controls visibility ── */
    function showControls() {
        controls.classList.add('visible');
        clearTimeout(uiTimer);
        if (!player.paused && !menuOpen) {
            uiTimer = setTimeout(() => { if (!menuOpen) controls.classList.remove('visible'); }, 3500);
        }
    }
    function hideControls() {
        if (menuOpen) return;
        controls.classList.remove('visible');
    }

    /* Mouse movement shows controls on desktop */
    wrapper.addEventListener('mousemove', () => { if (!isTouch) showControls(); });
    wrapper.addEventListener('mouseleave', () => { if (!isTouch && !menuOpen) hideControls(); });

    /* Click on video area (not controls) */
    wrapper.addEventListener('click', (e) => {
        if (controls.contains(e.target) || qualityMenu.contains(e.target)) return;
        if (menuOpen) { closeMenu(); return; }
        if (!isTouch) {
            togglePlay();
            showControls();
        }
    });

    /* Touch: single tap = show/hide, double tap = skip */
    let tapTimer = null, tapCount = 0, tapSide = null;
    wrapper.addEventListener('touchend', (e) => {
        if (controls.contains(e.target) || qualityMenu.contains(e.target)) return;
        if (menuOpen) { closeMenu(); return; }
        const x    = e.changedTouches[0].clientX;
        const side = x < wrapper.clientWidth / 2 ? 'L' : 'R';
        if (tapSide !== side) tapCount = 0;
        tapSide = side;
        tapCount++;
        clearTimeout(tapTimer);
        tapTimer = setTimeout(() => {
            if (tapCount === 1) {
                controls.classList.contains('visible') ? hideControls() : showControls();
            } else {
                skipBy(side === 'L' ? -10 : 10);
            }
            tapCount = 0;
        }, 250);
    });

    player.addEventListener('play',  showControls);
    player.addEventListener('pause', showControls);

    /* ── Keyboard shortcuts ── */
    function showKbHint(text) {
        kbHint.textContent = text;
        kbHint.classList.add('show');
        clearTimeout(kbHintTimer);
        kbHintTimer = setTimeout(() => kbHint.classList.remove('show'), 1200);
        showControls();
    }

    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT') return;
        switch (e.key) {
            case ' ':
            case 'k':
            case 'K':
                e.preventDefault();
                togglePlay();
                showControls();
                break;
            case 'ArrowLeft':
            case 'j':
            case 'J':
                e.preventDefault();
                skipBy(-10);
                showKbHint('← −10 сек');
                break;
            case 'ArrowRight':
            case 'l':
            case 'L':
                e.preventDefault();
                skipBy(+10);
                showKbHint('→ +10 сек');
                break;
            case 'ArrowUp':
                e.preventDefault();
                player.volume = Math.min(1, +(player.volume + 0.1).toFixed(2));
                player.muted  = false;
                updateVolIcon();
                showKbHint('↑ ' + Math.round(player.volume * 100) + '%');
                break;
            case 'ArrowDown':
                e.preventDefault();
                player.volume = Math.max(0, +(player.volume - 0.1).toFixed(2));
                player.muted  = player.volume === 0;
                updateVolIcon();
                showKbHint('↓ ' + Math.round(player.volume * 100) + '%');
                break;
            case 'm':
            case 'M':
                e.preventDefault();
                player.muted = !player.muted;
                updateVolIcon();
                showKbHint(player.muted ? 'M Mute' : 'M Unmute');
                break;
            case 'f':
            case 'F':
                e.preventDefault();
                isFs() ? exitFs() : requestFs();
                break;
        }
    });

    /* ── Fullscreen ── */
    function requestFs() {
        /* На iOS — fullscreen через сам video елемент */
        if (player.webkitEnterFullscreen) {
            player.webkitEnterFullscreen();
            return;
        }
        const el = wrapper;
        const fn = el.requestFullscreen
                || el.webkitRequestFullscreen
                || el.mozRequestFullScreen
                || el.msRequestFullscreen;
        if (fn) fn.call(el).catch(() => {});
    }
    function exitFs() {
        if (document.webkitExitFullscreen && player.webkitDisplayingFullscreen) {
            document.webkitExitFullscreen();
            return;
        }
        const fn = document.exitFullscreen
               || document.webkitExitFullscreen
               || document.mozCancelFullScreen
               || document.msExitFullscreen;
        if (fn) fn.call(document).catch(() => {});
    }
    function isFs() {
        return !!(document.fullscreenElement
               || document.webkitFullscreenElement
               || document.mozFullScreenElement
               || document.msFullscreenElement
               || player.webkitDisplayingFullscreen);
    }

    btnFs.addEventListener('click', (e) => {
        e.stopPropagation();
        isFs() ? exitFs() : requestFs();
        showControls();
    });

    function onFsChange() {
        const inFs = isFs();
        btnFs.innerHTML = inFs
            ? '<i class="ti ti-arrows-minimize"></i>'
            : '<i class="ti ti-arrows-maximize"></i>';
        try { inFs ? tg?.requestFullscreen?.() : tg?.exitFullscreen?.(); } catch {}
    }
    document.addEventListener('fullscreenchange',          onFsChange);
    document.addEventListener('webkitfullscreenchange',    onFsChange);
    document.addEventListener('mozfullscreenchange',       onFsChange);
    document.addEventListener('MSFullscreenChange',        onFsChange);
    player  .addEventListener('webkitbeginfullscreen',     onFsChange);
    player  .addEventListener('webkitendfullscreen',       onFsChange);
})();
</script>
</body>
</html>
