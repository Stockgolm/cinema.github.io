<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Player</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js"></script>
    <script>
        /* Запасний CDN для hls.js: якщо jsdelivr недоступний у мережі ПК,
           без hls.js на Chromium/Telegram Desktop відео не грає взагалі. */
        window.Hls || document.write('<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.6.15/hls.min.js"><\/script>');
    </script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        html, body {
            height: 100%;
            background: #000;
            overflow: hidden;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            color: #fff;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* Wrapper прибитий до країв вікна (fixed + inset), а не до висоти в px.
           Раніше висота бралась з tg.viewportStableHeight і могла «застрягти»
           на старому значенні після зміни режиму — плеєр то розгортався на весь
           екран, то ні. --app-bottom ставить JS лише коли WebApp не розгорнутий. */
        #wrapper {
            position: fixed;
            top: 0; left: 0; right: 0;
            bottom: var(--app-bottom, 0px);
            background: #000;
        }
        /* Окремими правилами: якщо один невідомий браузеру селектор стоїть у
           спільному списку, браузер відкидає ВСЕ правило. */
        #wrapper:fullscreen          { inset: 0; width: 100%; height: 100%; }
        #wrapper:-webkit-full-screen { inset: 0; width: 100%; height: 100%; }

        #wrapper.hide-cursor,
        #wrapper.hide-cursor * { cursor: none !important; }

        video {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
            background: #000;
            object-fit: contain;
        }

        /* ── Loader ── */
        #loader {
            position: absolute; inset: 0;
            display: flex; align-items: center; justify-content: center;
            pointer-events: none;
            transition: opacity 0.25s;
            z-index: 10;
        }
        #loader.hidden { opacity: 0; }
        .spinner {
            width: 48px; height: 48px;
            border: 3px solid rgba(255,255,255,0.15);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Skip flash ── */
        .skip-flash {
            position: absolute; top: 50%;
            transform: translateY(-50%);
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            pointer-events: none; opacity: 0;
            transition: opacity 0.2s;
            z-index: 15;
        }
        .skip-flash.show { opacity: 1; }
        .skip-flash i    { font-size: 38px; filter: drop-shadow(0 1px 4px rgba(0,0,0,0.6)); }
        .skip-flash span { font-size: 13px; font-weight: 600; text-shadow: 0 1px 3px rgba(0,0,0,0.6); }
        #skip-back { left: 12%; }
        #skip-fwd  { right: 12%; }

        /* ── Error overlay ── */
        #error-overlay {
            position: absolute; inset: 0;
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 12px; background: rgba(0,0,0,0.88);
            text-align: center; padding: 32px; z-index: 50;
        }
        #error-overlay.visible { display: flex; }
        .ov-icon { font-size: 44px; color: rgba(255,255,255,0.4); }
        #error-msg { font-size: 15px; color: rgba(255,255,255,0.75); max-width: 300px; line-height: 1.55; }
        #retry-btn {
            margin-top: 4px; padding: 9px 24px;
            border-radius: 8px; border: none;
            background: #e50914; color: #fff;
            font-size: 14px; font-weight: 600;
            cursor: pointer; touch-action: manipulation;
        }

        /* ── No-data ── */
        #no-data {
            position: absolute; inset: 0;
            display: none; flex-direction: column;
            align-items: center; justify-content: center;
            gap: 12px; z-index: 50;
        }
        #no-data.visible { display: flex; }
        #no-data span { font-size: 15px; color: rgba(255,255,255,0.5); }

        /* ── Controls ── */
        #controls {
            position: absolute;
            bottom: 0; left: 0; right: 0;
            padding: 0 0 calc(8px + env(safe-area-inset-bottom, 0px));
            padding: 0 max(env(safe-area-inset-right, 0px), var(--tg-sa-right, 0px))
                     calc(8px + max(env(safe-area-inset-bottom, 0px), var(--tg-sa-bottom, 0px)))
                     max(env(safe-area-inset-left, 0px), var(--tg-sa-left, 0px));
            background: linear-gradient(transparent, rgba(0,0,0,0.85) 55%);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 20;
        }
        #controls.visible { opacity: 1; pointer-events: auto; }

        #progress-wrap { padding: 14px 12px 8px; cursor: pointer; touch-action: none; }
        #progress-track {
            height: 3px;
            background: rgba(255,255,255,0.22);
            border-radius: 2px;
            position: relative;
            transition: height 0.15s;
        }
        #controls:hover #progress-track { height: 5px; }
        #progress-buf {
            position: absolute; left: 0; top: 0; height: 100%;
            background: rgba(255,255,255,0.28);
            border-radius: 2px; width: 0%;
        }
        #progress-fill {
            position: absolute; left: 0; top: 0; height: 100%;
            background: #e50914; border-radius: 2px; width: 0%;
        }
        #progress-thumb {
            position: absolute; top: 50%;
            transform: translate(-50%, -50%) scale(0);
            width: 14px; height: 14px;
            background: #fff; border-radius: 50%;
            left: 0%; pointer-events: none;
            transition: transform 0.15s;
        }
        #controls:hover #progress-thumb { transform: translate(-50%, -50%) scale(1); }

        #btn-row { display: flex; align-items: center; padding: 0 4px; min-height: 44px; }

        .ctrl-btn {
            background: none; border: none; color: #fff;
            cursor: pointer;
            min-width: 40px; height: 40px;
            padding: 0 6px;
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: 22px; line-height: 1;
            touch-action: manipulation;
            transition: background 0.12s;
            flex-shrink: 0;
        }
        .ctrl-btn:hover  { background: rgba(255,255,255,0.1); }
        .ctrl-btn:active { background: rgba(255,255,255,0.2); }
        .ctrl-btn[hidden] { display: none; }

        #btn-back, #btn-fwd { display: none; }
        @media (pointer: coarse) { #btn-back, #btn-fwd { display: flex; } }

        #time-display {
            font-size: 12px;
            color: rgba(255,255,255,0.85);
            white-space: nowrap;
            padding: 0 6px;
            flex-shrink: 0;
            font-variant-numeric: tabular-nums;
        }
        .spacer { flex: 1; min-width: 8px; }

        #vol-wrap { display: flex; align-items: center; flex-shrink: 0; }
        #vol-slider-wrap {
            width: 0; overflow: hidden;
            transition: width 0.25s;
            display: flex; align-items: center;
        }
        #vol-wrap:hover #vol-slider-wrap { width: 72px; }
        #vol-slider {
            -webkit-appearance: none; appearance: none;
            width: 68px; height: 3px;
            background: rgba(255,255,255,0.3);
            border-radius: 2px; outline: none;
            cursor: pointer; accent-color: #e50914;
        }
        #vol-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 13px; height: 13px;
            border-radius: 50%; background: #fff; cursor: pointer;
        }
        #vol-slider::-moz-range-thumb {
            width: 13px; height: 13px;
            border-radius: 50%; background: #fff; border: none; cursor: pointer;
        }

        #quality-btn {
            background: rgba(255,255,255,0.1);
            border: 1px solid rgba(255,255,255,0.18);
            color: #fff; cursor: pointer;
            padding: 5px 10px; border-radius: 6px;
            font-size: 12px; font-weight: 700;
            letter-spacing: 0.04em;
            touch-action: manipulation;
            transition: background 0.12s, border-color 0.12s;
            white-space: nowrap; flex-shrink: 0;
            display: flex; align-items: center; gap: 4px;
            height: 30px;
        }
        #quality-btn:hover { background: rgba(255,255,255,0.2); }
        #quality-btn.open  { background: #e50914; border-color: #e50914; }
        #quality-btn .q-arrow { font-size: 13px; transition: transform 0.2s; }
        #quality-btn.open .q-arrow { transform: rotate(180deg); }

        #quality-menu {
            position: absolute;
            bottom: 62px;
            bottom: calc(62px + max(env(safe-area-inset-bottom, 0px), var(--tg-sa-bottom, 0px)));
            right: 8px;
            right: calc(8px + max(env(safe-area-inset-right, 0px), var(--tg-sa-right, 0px)));
            background: rgba(15,15,15,0.97);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px; overflow: hidden;
            min-width: 120px;
            display: none; flex-direction: column;
            z-index: 30;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }
        #quality-menu.open { display: flex; }
        #quality-menu-title {
            font-size: 11px; font-weight: 600;
            color: rgba(255,255,255,0.35);
            letter-spacing: 0.08em; text-transform: uppercase;
            padding: 10px 16px 6px;
        }
        .qm-item {
            display: flex; align-items: center; gap: 10px;
            padding: 10px 14px; font-size: 14px; font-weight: 500;
            cursor: pointer; touch-action: manipulation;
            border: none; background: none;
            color: rgba(255,255,255,0.65);
            text-align: left; width: 100%;
            transition: background 0.1s, color 0.1s;
        }
        .qm-item:not(:last-child) { border-bottom: 1px solid rgba(255,255,255,0.06); }
        .qm-item:hover  { background: rgba(255,255,255,0.07); color: #fff; }
        .qm-item.active { color: #fff; }
        .qm-check { font-size: 15px; color: #e50914; visibility: hidden; flex-shrink: 0; }
        .qm-item.active .qm-check { visibility: visible; }

        /* Бейдж версії (тап → діагностика). Відступ зверху враховує кнопки
           Telegram у повноекранному режимі (--tg-sa-top). */
        #ver-badge {
            position: absolute;
            top: calc(8px + var(--tg-sa-top, 0px));
            left: calc(8px + var(--tg-sa-left, 0px));
            padding: 6px 10px;
            font-size: 11px;
            color: rgba(255,255,255,0.45);
            z-index: 61;
            cursor: pointer;
            transition: opacity 1s;
        }
        #ver-badge.fade { opacity: 0; }

        #dbg-panel {
            position: absolute;
            top: calc(40px + var(--tg-sa-top, 0px));
            left: 8px; right: 8px;
            max-height: 65%;
            overflow: auto;
            background: rgba(0,0,0,0.88);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 8px;
            padding: 10px;
            font: 10px/1.5 Consolas, monospace;
            color: #8f8;
            white-space: pre-wrap;
            word-break: break-all;
            user-select: text;
            display: none;
            z-index: 60;
        }

        #kb-hint {
            position: absolute;
            bottom: 70px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.75);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 8px;
            padding: 6px 14px;
            font-size: 13px; color: rgba(255,255,255,0.8);
            pointer-events: none;
            opacity: 0; transition: opacity 0.2s;
            white-space: nowrap; z-index: 25;
        }
        #kb-hint.show { opacity: 1; }
    </style>
</head>
<body>
<div id="wrapper">
    <video id="player" playsinline webkit-playsinline x5-playsinline autoplay preload="auto"></video>

    <div id="loader"><div class="spinner"></div></div>

    <div class="skip-flash" id="skip-back"><i class="ti ti-rewind-10"></i><span>−10 сек</span></div>
    <div class="skip-flash" id="skip-fwd"><i class="ti ti-forward-10"></i><span>+10 сек</span></div>

    <div id="kb-hint"></div>
    <div id="ver-badge">player v14</div>
    <div id="dbg-panel"></div>

    <div id="error-overlay">
        <i class="ov-icon ti ti-alert-triangle" aria-hidden="true"></i>
        <p id="error-msg">Не вдалося завантажити відео</p>
        <button id="retry-btn">Спробувати знову</button>
    </div>

    <div id="no-data">
        <i class="ov-icon ti ti-video-off" aria-hidden="true"></i>
        <span>Відео не знайдено</span>
    </div>

    <div id="quality-menu" role="menu" aria-label="Якість">
        <div id="quality-menu-title">Якість</div>
    </div>

    <div id="controls">
        <div id="progress-wrap" role="slider" aria-label="Прогрес">
            <div id="progress-track">
                <div id="progress-buf"></div>
                <div id="progress-fill"></div>
                <div id="progress-thumb"></div>
            </div>
        </div>
        <div id="btn-row">
            <button class="ctrl-btn" id="btn-play" aria-label="Відтворити">
                <i class="ti ti-player-play-filled"></i>
            </button>
            <button class="ctrl-btn" id="btn-back" aria-label="−10 секунд" title="←  або J">
                <i class="ti ti-rewind-10"></i>
            </button>
            <button class="ctrl-btn" id="btn-fwd" aria-label="+10 секунд" title="→  або L">
                <i class="ti ti-forward-10"></i>
            </button>
            <span id="time-display">0:00 / 0:00</span>
            <div class="spacer"></div>
            <div id="vol-wrap">
                <button class="ctrl-btn" id="btn-mute" aria-label="Звук" title="M">
                    <i class="ti ti-volume"></i>
                </button>
                <div id="vol-slider-wrap">
                    <input type="range" id="vol-slider" min="0" max="1" step="0.01" value="0.15">
                </div>
            </div>
            <button id="quality-btn" aria-label="Якість" aria-haspopup="true" aria-expanded="false">
                <span id="quality-label">—</span>
                <i class="ti ti-chevron-up q-arrow" aria-hidden="true"></i>
            </button>
            <button class="ctrl-btn" id="btn-fs" aria-label="Повний екран" title="F">
                <i class="ti ti-arrows-maximize"></i>
            </button>
        </div>
    </div>
</div>

<script>
(function () {
    'use strict';
    const VERSION = 'v14';

    /* ══════════════════════ CORS-проксі ══════════════════════
       Телефони (iOS/Android) і новий Chrome грають HLS «рідно» — без CORS.
       Telegram Desktop на частині ПК рідного HLS не має → hls.js → сервер
       відео не дозволяє такі запити з чужого сайту → «помилка мережі».
       Тоді (і ТІЛЬКИ тоді) плеєр іде через публічний CORS-проксі зі списку,
       по черзі. Формат: префікс, до якого дописується закодована адреса.
       Список можна змінити/доповнити; порожній масив = проксі вимкнено. */
    const PROXIES = [
        'https://corsproxy.io/?url=',
        'https://api.codetabs.com/v1/proxy?quest=',
    ];
    let proxyIdx = -1;   // -1 = напряму
    const PROXY = PROXIES.length ? 'on' : '';
    const proxyPrefix = () => proxyIdx >= 0 ? PROXIES[proxyIdx] : '';

    /* ══════════════════════ Діагностика ══════════════════════ */
    const dbgLog = [];
    function dbg(msg) {
        dbgLog.push(new Date().toTimeString().slice(0, 8) + ' ' + msg);
        if (dbgLog.length > 120) dbgLog.shift();
        const p = document.getElementById('dbg-panel');
        if (p && p.style.display === 'block') renderDbg();
    }
    function renderDbg() {
        const p = document.getElementById('dbg-panel');
        p.textContent =
            'player ' + VERSION + '  platform=' + (tgPlatform || 'browser') + '  botAPI=' + (tg?.version || '-') +
            '\nfsMode=' + fsMode + '  isFs=' + isFs() + '  tg.isFullscreen=' + (tg ? String(tg.isFullscreen) : '-') +
            '\nengine=' + engine + '  proxy=' + (useProxy ? proxyPrefix() : 'off') +
            '  Hls=' + (typeof Hls !== 'undefined' ? (Hls.version || 'yes') : 'NO') +
            '\nnativeHLS=' + (player.canPlayType('application/vnd.apple.mpegurl') || '""') +
            '  viewport=' + window.innerWidth + 'x' + window.innerHeight +
            '\n' + navigator.userAgent +
            '\n──────────\n' + dbgLog.join('\n');
    }
    function toggleDbg() {
        const p = document.getElementById('dbg-panel');
        const show = p.style.display !== 'block';
        p.style.display = show ? 'block' : 'none';
        if (show) renderDbg();
    }
    window.addEventListener('error', (e) =>
        dbg('JS ERROR: ' + (e.message || e.type) + ' [' + ((e.filename || '').split('/').pop()) + ':' + e.lineno + ']'));
    window.addEventListener('unhandledrejection', (e) =>
        dbg('PROMISE ERROR: ' + (e.reason?.message || e.reason)));

    /* ══════════════════════ DOM ══════════════════════ */
    const $ = (id) => document.getElementById(id);
    const player = $('player'), wrapper = $('wrapper'), loader = $('loader');
    const errorOv = $('error-overlay'), errorMsg = $('error-msg'), retryBtn = $('retry-btn');
    const noData = $('no-data'), controls = $('controls');
    const progressWrap = $('progress-wrap'), progressFill = $('progress-fill');
    const progressBuf = $('progress-buf'), progressThumb = $('progress-thumb');
    const btnPlay = $('btn-play'), btnBack = $('btn-back'), btnFwd = $('btn-fwd');
    const btnMute = $('btn-mute'), btnFs = $('btn-fs'), volSlider = $('vol-slider');
    const timeDisplay = $('time-display');
    const qualityBtn = $('quality-btn'), qualityLabel = $('quality-label'), qualityMenu = $('quality-menu');
    const skipBackEl = $('skip-back'), skipFwdEl = $('skip-fwd'), kbHint = $('kb-hint');
    const verBadge = $('ver-badge');

    /* ══════════════════════ Стан ══════════════════════ */
    let hls = null, qualities = {}, currentLabel = null;
    let uiTimer = null, menuOpen = false, scrubbing = false;
    let kbHintTimer = null, skipTimers = {};
    let justTouched = false, hoverUI = false;
    let loadId = 0;            // «покоління» завантаження: старі обробники ігнорують себе
    let engine = 'none';       // native | hlsjs | direct
    let useProxy = false;
    let triedHlsJs = false, triedNativeLast = false;
    let netRetries = 0, mediaRetries = 0;
    let lastGoodTime = 0;
    let lastFsToggle = 0;
    let fsBusy = false, fsBusyTimer = null, fsWanted = false, userToggledFs = false;
    try {
        const saved = sessionStorage.getItem('cv_proxy_idx');
        if (saved !== null && +saved < PROXIES.length) { proxyIdx = +saved; useProxy = proxyIdx >= 0; }
    } catch {}

    /* ══════════════════════ Telegram ══════════════════════
       telegram-web-app.js підключений завжди, тому window.Telegram.WebApp
       існує і у звичайному браузері (platform='unknown'). Відрізняємо. */
    const tg = window.Telegram?.WebApp;
    const tgPlatform = (tg?.platform && tg.platform !== 'unknown') ? tg.platform : '';
    const inTg = !!tgPlatform;
    const isMobileTg = ['android', 'android_x', 'ios'].includes(tgPlatform);
    const tgVerOk = (v) => { try { return !!tg?.isVersionAtLeast?.(v); } catch { return false; } };

    /* Один режим fullscreen на всю сесію — без змішування (раніше на iPhone
       кнопка відкривала системний плеєр iOS, а при старті — Telegram-фулскрін,
       і стани плутались). */
    const fsElement = () => document.fullscreenElement || document.webkitFullscreenElement || null;
    const elFsOk = !!(wrapper.requestFullscreen || wrapper.webkitRequestFullscreen)
                && !!(document.fullscreenEnabled || document.webkitFullscreenEnabled);
    const videoFsOk = typeof player.webkitEnterFullscreen === 'function';
    const tgFsOk = inTg && tgVerOk('8.0') && typeof tg.requestFullscreen === 'function';
    const fallbackFsMode = () => elFsOk ? 'element' : videoFsOk ? 'video' : 'none';
    /* iPhone (немає fullscreen для елементів): кнопка відкриває системний
       плеєр iOS — справжній повний екран з поворотом, як було у v11.
       Telegram-фулскрін при старті лишається окремо (автоматично). */
    const isIPhone = videoFsOk && !elFsOk;
    let fsMode = isIPhone ? 'video' : tgFsOk ? 'tg' : fallbackFsMode();

    dbg('init: platform=' + (tgPlatform || 'browser') + ' botAPI=' + (tg?.version || '-') + ' fsMode=' + fsMode);

    if (inTg) {
        try { tg.ready(); } catch {}
        try { tg.expand(); } catch {}
        try { tg.setHeaderColor('#000000'); tg.setBackgroundColor('#000000'); } catch (e) { dbg('setColor: ' + (e.message || e)); }
        if (tgVerOk('7.7')) { try { tg.disableVerticalSwipes(); } catch (e) { dbg('disableVerticalSwipes: ' + (e.message || e)); } }

        tg.onEvent('viewportChanged', applyLayout);
        tg.onEvent('safeAreaChanged', applyLayout);
        tg.onEvent('contentSafeAreaChanged', applyLayout);
        tg.onEvent('fullscreenChanged', () => {
            dbg('tg fullscreenChanged → ' + tg.isFullscreen);
            clearFsBusy(); applyLayout(); syncFsIcon(); showControls();
        });
        tg.onEvent('fullscreenFailed', (p) => {
            const err = (p && p.error) || '?';
            dbg('tg fullscreenFailed: ' + err);
            clearFsBusy();
            if (err === 'UNSUPPORTED') {
                // Клієнт не вміє Telegram-фулскрін → назавжди переходимо на браузерний.
                fsMode = fallbackFsMode();
                dbg('fsMode → ' + fsMode);
                if (fsWanted) enterFs(true);
            }
            syncFsIcon();
        });

        // Телефон: автоматично на весь екран. Telegram інколи ігнорує запит,
        // надісланий одразу при старті, тому — одна повторна спроба.
        if (isMobileTg && tgFsOk) {
            const autoFs = (left) => {
                if (tg.isFullscreen || userToggledFs) return;
                try { tg.requestFullscreen(); dbg('auto tg.requestFullscreen (' + left + ')'); } catch (e) { dbg('auto fs: ' + (e.message || e)); return; }
                if (left > 0) setTimeout(() => autoFs(left - 1), 1200);
            };
            setTimeout(() => autoFs(1), 60);
        }
    }

    /* Розміри та safe-area. Висоту більше не фіксуємо в px — лише відступ
       знизу, коли WebApp не розгорнутий і частина вебв'ю схована під екраном. */
    function applyLayout() {
        const st = document.documentElement.style;
        if (!inTg) return;
        let gap = 0;
        const vh = tg.viewportHeight;
        if (vh && !tg.isFullscreen && !tg.isExpanded) {
            gap = Math.round(window.innerHeight - vh);
            if (gap < 0 || gap > window.innerHeight * 0.8) gap = 0;
        }
        st.setProperty('--app-bottom', gap + 'px');
        const sa = tg.safeAreaInset || {}, ca = tg.contentSafeAreaInset || {};
        st.setProperty('--tg-sa-top',    ((sa.top    || 0) + (ca.top    || 0)) + 'px');
        st.setProperty('--tg-sa-bottom', ((sa.bottom || 0) + (ca.bottom || 0)) + 'px');
        st.setProperty('--tg-sa-left',   ((sa.left   || 0) + (ca.left   || 0)) + 'px');
        st.setProperty('--tg-sa-right',  ((sa.right  || 0) + (ca.right  || 0)) + 'px');
    }
    applyLayout();
    window.addEventListener('resize', applyLayout);

    /* ══════════════════════ Дані з URL ══════════════════════ */
    const dataParam = new URLSearchParams(window.location.search).get('data');
    if (!dataParam) {
        noData.classList.add('visible');
        loader.classList.add('hidden');
        return;
    }
    try {
        let b64 = dataParam.replace(/-/g, '+').replace(/_/g, '/').replace(/\s/g, '');
        if (b64.length % 4) b64 += '='.repeat(4 - (b64.length % 4));
        const bin = atob(b64);
        const bytes = Uint8Array.from(bin, c => c.charCodeAt(0));
        qualities = JSON.parse(new TextDecoder('utf-8').decode(bytes));
        if (!qualities || typeof qualities !== 'object' || !Object.keys(qualities).length) throw 0;
    } catch {
        showError('Невірний формат даних', false);
        return;
    }

    /* ══════════════════════ Продовження перегляду ══════════════════════ */
    const resumeKey = (() => {
        try { const u = new URL(Object.values(qualities)[0], location.href); return 'cv_pos:' + u.host + u.pathname; }
        catch { return null; }
    })();
    function readResume() {
        try { return resumeKey ? (+localStorage.getItem(resumeKey) || 0) : 0; } catch { return 0; }
    }
    let lastSave = 0;
    function saveResume(force) {
        if (!resumeKey || !isFinite(player.duration) || !player.duration) return;
        const now = Date.now();
        if (!force && now - lastSave < 5000) return;
        lastSave = now;
        const t = player.currentTime;
        try {
            const nearEnd = player.duration - t < Math.min(90, player.duration * 0.05);
            if (t < 15 || nearEnd) localStorage.removeItem(resumeKey);
            else localStorage.setItem(resumeKey, String(Math.floor(t)));
        } catch {}
    }
    window.addEventListener('pagehide', () => saveResume(true));
    document.addEventListener('visibilitychange', () => { if (document.hidden) saveResume(true); });

    /* ══════════════════════ Меню якості ══════════════════════ */
    for (const label of Object.keys(qualities)) {
        const item = document.createElement('button');
        item.className = 'qm-item';
        item.dataset.label = label;
        item.setAttribute('role', 'menuitem');
        const check = document.createElement('i');
        check.className = 'ti ti-check qm-check';
        check.setAttribute('aria-hidden', 'true');
        const text = document.createElement('span');
        text.textContent = label;
        item.append(check, text);
        item.addEventListener('click', (e) => {
            e.stopPropagation();
            if (label !== currentLabel) loadVideo(label, { time: player.currentTime || lastGoodTime });
            closeMenu();
            showControls();
        });
        qualityMenu.appendChild(item);
    }

    /* ══════════════════════ Завантаження відео ══════════════════════ */
    function isHlsUrl(u) { return /\.m3u8($|[?#])/i.test(u) || u.includes('.m3u8'); }
    function hostOf(u) { try { return new URL(u, location.href).host; } catch { return '?'; } }
    function canNativeHls() {
        return !!(player.canPlayType('application/vnd.apple.mpegurl') || player.canPlayType('application/x-mpegURL'));
    }
    function hlsJsOk() { return typeof Hls !== 'undefined' && Hls.isSupported(); }

    function destroyHls() {
        if (hls) { try { hls.destroy(); } catch {} hls = null; }
    }
    function resetMedia() {
        destroyHls();
        player.removeAttribute('src');
        try { player.load(); } catch {}
    }

    /* opts.time — з якої секунди почати; opts.resumeHint — показати підказку */
    function loadVideo(label, opts = {}) {
        const url = qualities[label];
        if (!url) return;
        const id = ++loadId;
        currentLabel = label;
        triedHlsJs = false; triedNativeLast = false;
        netRetries = 0; mediaRetries = 0;
        setLoading(true);
        hideError();
        updateQualityUI(label);
        resetMedia();
        const start = opts.time > 0 ? opts.time : 0;
        dbg('load "' + label + '" host=' + hostOf(url) + ' t=' + Math.floor(start));

        const isHls = isHlsUrl(url);
        if (isHls && canNativeHls() && !useProxy) startNative(url, start, id, opts.resumeHint);
        else if (isHls && hlsJsOk()) startHlsJs(url, start, id, opts.resumeHint);
        else if (isHls && !canNativeHls()) {
            dbg('hls.js недоступний, native HLS нема');
            showError('Бібліотека відтворення не завантажилась. Перевірте інтернет і натисніть «Спробувати знову».');
        } else startNative(url, start, id, opts.resumeHint, 'direct');
    }

    function startNative(url, start, id, resumeHint, kind = 'native') {
        engine = kind;
        dbg('engine: ' + kind);
        player.addEventListener('loadedmetadata', () => {
            if (id !== loadId) return;
            restorePlayback(start, resumeHint);
        }, { once: true });
        player.src = url;
    }

    /* Завантажувач hls.js, що пропускає КОЖЕН запит (плейлисти, сегменти,
       ключі) через проксі, але для hls.js адреса лишається оригінальною —
       тож відносні шляхи в плейлисті розв'язуються правильно. */
    function makeProxyLoader(prefix) {
        const Base = Hls.DefaultConfig.loader;
        return class ProxyLoader extends Base {
            load(context, config, callbacks) {
                const orig = context.url;
                context.url = prefix + encodeURIComponent(orig);
                const cb = Object.assign({}, callbacks, {
                    onSuccess: (response, stats, ctx, nd) => {
                        response.url = orig; ctx.url = orig;
                        callbacks.onSuccess(response, stats, ctx, nd);
                    },
                });
                super.load(context, config, cb);
            }
        };
    }

    function startHlsJs(url, start, id, resumeHint) {
        destroyHls();
        triedHlsJs = true;
        engine = 'hlsjs';
        dbg('engine: hls.js' + (useProxy ? ' via proxy ' + proxyPrefix() : ''));
        const cfg = {
            startPosition: start > 0 ? start : -1,
            maxBufferLength: 30,
            maxMaxBufferLength: 120,
            backBufferLength: 60,
            enableWorker: true,
            manifestLoadingMaxRetry: 1,
            levelLoadingMaxRetry: 4,
            fragLoadingMaxRetry: 6,
        };
        if (useProxy) cfg.loader = makeProxyLoader(proxyPrefix());
        const h = hls = new Hls(cfg);
        h.on(Hls.Events.MANIFEST_PARSED, () => {
            if (id !== loadId) return;
            restorePlayback(0, resumeHint && start);   // позицію вже задав startPosition
        });
        h.on(Hls.Events.FRAG_LOADED, () => { netRetries = 0; });
        h.on(Hls.Events.ERROR, (_e, d) => {
            if (id !== loadId || h !== hls) return;
            if (!d.fatal) return;
            dbg('hls fatal: ' + d.type + ' / ' + d.details + ' code=' + (d.response?.code ?? '-'));

            if (d.type === Hls.ErrorTypes.NETWORK_ERROR) {
                const manifestStage = /manifest|level/i.test(d.details || '') && !player.currentTime;
                const corsLike = manifestStage && (!d.response || d.response.code === 0);
                // 1) Сервер не дав CORS (або проксі не спрацював) → наступний
                //    проксі зі списку; вдалий запам'ятовується на сесію.
                if ((corsLike || (useProxy && manifestStage)) && proxyIdx + 1 < PROXIES.length) {
                    proxyIdx++;
                    useProxy = true;
                    try { sessionStorage.setItem('cv_proxy_idx', String(proxyIdx)); } catch {}
                    dbg('схоже на CORS → проксі #' + proxyIdx);
                    startHlsJs(url, start, id, resumeHint);
                    return;
                }
                // 2) Проксі нема — остання спроба: віддати посилання браузеру напряму.
                if (corsLike && !triedNativeLast) {
                    triedNativeLast = true;
                    destroyHls();
                    startNative(url, start, id, resumeHint, 'direct');
                    return;
                }
                // 3) Звичайний збій мережі під час перегляду → кілька повторів.
                if (!manifestStage && netRetries < 4) {
                    netRetries++;
                    const delay = 1000 * netRetries;
                    dbg('мережа: повтор ' + netRetries + ' через ' + delay + 'мс');
                    setLoading(true);
                    setTimeout(() => { if (h === hls) h.startLoad(); }, delay);
                    return;
                }
                if (corsLike || (useProxy && manifestStage)) {
                    try { sessionStorage.removeItem('cv_proxy_idx'); } catch {}
                    showCorsError(); return;
                }
                showError(corsLike && !PROXY
                    ? 'Цей браузер не може відкрити потік напряму (сервер відео не дозволяє). Оновіть Chrome/Edge/Telegram або відкрийте на телефоні.'
                    : "Помилка мережі. Перевірте з'єднання.");
                return;
            }
            if (d.type === Hls.ErrorTypes.MEDIA_ERROR && mediaRetries < 2) {
                mediaRetries++;
                dbg('media error → recover (' + mediaRetries + ')');
                if (mediaRetries === 2) { try { h.swapAudioCodec(); } catch {} }
                h.recoverMediaError();
                return;
            }
            showError('Помилка відтворення потоку.');
        });
        h.attachMedia(player);
        h.loadSource(url);
    }

    function restorePlayback(time, resumeHint) {
        if (time > 0 && (!isFinite(player.duration) || time < player.duration - 5)) {
            try { player.currentTime = time; } catch {}
        }
        setLoading(false);
        if (resumeHint) showKbHint('Продовжено з ' + fmt(resumeHint));
        player.play().catch(() => {
            player.muted = true;   // автоплей зі звуком заблоковано → без звуку
            player.play().catch(() => { showControls(); });
        });
    }

    // Єдиний обробник помилок <video> (раніше їх було два: один показував
    // помилку, другий паралельно перемикав на hls.js — оверлей лишався).
    player.addEventListener('error', () => {
        if (engine === 'hlsjs' || engine === 'none') return;   // hls.js звітує сам
        if (!player.getAttribute('src')) return;               // це наш reset
        const code = player.error?.code;
        dbg('video error code=' + code + ' engine=' + engine);
        const id = loadId, url = qualities[currentLabel];
        const at = player.currentTime || lastGoodTime;
        // Рідний HLS не впорався → hls.js.
        if (engine === 'native' && !triedHlsJs && hlsJsOk() && isHlsUrl(url)) {
            resetMedia();
            startHlsJs(url, at, id);
            return;
        }
        // Обрив мережі посеред фільму → тихо перезапустити з того ж місця.
        if (code === 2 && netRetries < 3) {
            netRetries++;
            setLoading(true);
            setTimeout(() => { if (id === loadId) { resetMedia(); startNative(url, at, id, 0, engine); } }, 1500 * netRetries);
            return;
        }
        if (triedNativeLast) { showCorsError(); return; }
        if (triedNativeLast) {
            showError(PROXY
                ? "Помилка мережі. Перевірте з'єднання."
                : 'Цей браузер не може відкрити потік напряму (сервер відео не дозволяє). Оновіть Chrome/Edge/Telegram або відкрийте на телефоні.');
            return;
        }
        const m = {1:'Завантаження перервано.', 2:"Помилка мережі. Перевірте з'єднання.", 3:'Помилка декодування.', 4:'Формат не підтримується цим браузером.'};
        showError(m[code] || 'Невідома помилка.');
    });

    function updateQualityUI(label) {
        qualityLabel.textContent = label;
        qualityMenu.querySelectorAll('.qm-item').forEach(el =>
            el.classList.toggle('active', el.dataset.label === label));
    }

    /* ══════════════════════ Час і прогрес ══════════════════════ */
    function fmt(s) {
        s = Math.floor(isFinite(s) ? s : 0);
        const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
        const sec = String(s % 60).padStart(2, '0');
        return h > 0 ? `${h}:${String(m).padStart(2, '0')}:${sec}` : `${m}:${sec}`;
    }
    player.addEventListener('timeupdate', () => {
        if (player.currentTime > 0) lastGoodTime = player.currentTime;
        saveResume(false);
        if (scrubbing) return;
        const pct = player.duration ? (player.currentTime / player.duration) * 100 : 0;
        progressFill.style.width = pct + '%';
        progressThumb.style.left = pct + '%';
        timeDisplay.textContent = fmt(player.currentTime) + ' / ' + fmt(player.duration);
    });
    player.addEventListener('progress', () => {
        if (!player.duration || !player.buffered.length) return;
        // буфер навколо поточної позиції, а не останній шматок
        let end = 0;
        for (let i = 0; i < player.buffered.length; i++) {
            if (player.buffered.start(i) <= player.currentTime + 1) end = player.buffered.end(i);
        }
        progressBuf.style.width = (end / player.duration * 100) + '%';
    });

    /* ══════════════════════ Перемотування ══════════════════════ */
    function scrubAt(clientX) {
        const rect = progressWrap.getBoundingClientRect();
        const pct = Math.max(0, Math.min(1, (clientX - rect.left) / rect.width));
        if (player.duration) {
            player.currentTime = pct * player.duration;
            progressFill.style.width = (pct * 100) + '%';
            progressThumb.style.left = (pct * 100) + '%';
            timeDisplay.textContent = fmt(pct * player.duration) + ' / ' + fmt(player.duration);
        }
    }
    progressWrap.addEventListener('mousedown', (e) => { e.stopPropagation(); scrubbing = true; scrubAt(e.clientX); });
    progressWrap.addEventListener('touchstart', (e) => { e.stopPropagation(); scrubbing = true; scrubAt(e.touches[0].clientX); }, { passive: true });
    document.addEventListener('mousemove', (e) => { if (scrubbing) scrubAt(e.clientX); });
    progressWrap.addEventListener('touchmove', (e) => {
        if (scrubbing) { e.preventDefault(); scrubAt(e.touches[0].clientX); }
    }, { passive: false });
    document.addEventListener('mouseup', () => { scrubbing = false; });
    document.addEventListener('touchend', () => { scrubbing = false; });
    document.addEventListener('touchcancel', () => { scrubbing = false; });

    /* ══════════════════════ Play / Pause ══════════════════════ */
    function togglePlay() {
        if (player.paused) player.play().catch(() => {});
        else player.pause();
    }
    btnPlay.addEventListener('click', (e) => { e.stopPropagation(); togglePlay(); });
    player.addEventListener('play',  () => { btnPlay.innerHTML = '<i class="ti ti-player-pause-filled"></i>'; showControls(); });
    player.addEventListener('pause', () => {
        btnPlay.innerHTML = '<i class="ti ti-player-play-filled"></i>';
        if (player.readyState >= 2) setLoading(false);
        saveResume(true);
        showControls();
    });
    player.addEventListener('ended', () => { try { resumeKey && localStorage.removeItem(resumeKey); } catch {} });

    /* ══════════════════════ ±10 сек ══════════════════════ */
    function flashSkip(el, key) {
        el.classList.add('show');
        clearTimeout(skipTimers[key]);
        skipTimers[key] = setTimeout(() => el.classList.remove('show'), 700);
    }
    function skipBy(sec) {
        if (!isFinite(player.duration)) return;
        player.currentTime = Math.max(0, Math.min(player.duration, player.currentTime + sec));
        flashSkip(sec < 0 ? skipBackEl : skipFwdEl, sec < 0 ? 'b' : 'f');
        showControls();
    }
    btnBack.addEventListener('click', (e) => { e.stopPropagation(); skipBy(-10); });
    btnFwd .addEventListener('click', (e) => { e.stopPropagation(); skipBy(+10); });

    /* ══════════════════════ Гучність ══════════════════════ */
    function updateVolIcon() {
        const off = player.muted || player.volume === 0;
        const icon = off ? 'ti-volume-off' : player.volume < 0.5 ? 'ti-volume-2' : 'ti-volume';
        btnMute.innerHTML = `<i class="ti ${icon}"></i>`;
        volSlider.value = player.muted ? 0 : player.volume;
    }
    btnMute.addEventListener('click', (e) => {
        e.stopPropagation();
        player.muted = !player.muted;
        if (!player.muted && player.volume === 0) player.volume = 0.15;
        updateVolIcon(); showControls();
    });
    volSlider.addEventListener('input', (e) => {
        e.stopPropagation();
        player.volume = +volSlider.value;
        player.muted = player.volume === 0;
        updateVolIcon(); showControls();
    });
    volSlider.addEventListener('click',      (e) => e.stopPropagation());
    volSlider.addEventListener('mousedown',  (e) => e.stopPropagation());
    volSlider.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
    player.addEventListener('volumechange', updateVolIcon);

    /* ══════════════════════ Лоадер і помилки ══════════════════════ */
    function setLoading(on) { loader.classList.toggle('hidden', !on); }
    player.addEventListener('waiting',        () => setLoading(true));
    player.addEventListener('playing',        () => { setLoading(false); netRetries = 0; });
    player.addEventListener('canplay',        () => setLoading(false));
    player.addEventListener('canplaythrough', () => setLoading(false));
    player.addEventListener('loadeddata',     () => setLoading(false));
    player.addEventListener('loadstart',      () => { if (player.getAttribute('src')) setLoading(true); });

    function showError(msg, canRetry = true) {
        setLoading(false);
        errorMsg.textContent = msg;
        retryBtn.style.display = canRetry ? '' : 'none';
        errorOv.classList.add('visible');
        dbg('ERROR shown: ' + msg);
    }
    function hideError() { errorOv.classList.remove('visible'); }

    function showCorsError() {
        showError(inTg
            ? 'На цьому ПК Telegram не може відкрити це відео напряму (сервер відео не дозволяє).'
            : 'Цей браузер не може відкрити потік напряму (сервер відео не дозволяє).');
    }
    // Повтор — з того ж місця, а не з нуля.
    retryBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        if (currentLabel) loadVideo(currentLabel, { time: lastGoodTime });
    });
    // Інтернет повернувся → повторити автоматично.
    window.addEventListener('online', () => {
        dbg('online');
        if (errorOv.classList.contains('visible') && currentLabel) loadVideo(currentLabel, { time: lastGoodTime });
    });

    /* ══════════════════════ Меню якості ══════════════════════ */
    function openMenu() {
        menuOpen = true;
        qualityMenu.classList.add('open'); qualityBtn.classList.add('open');
        qualityBtn.setAttribute('aria-expanded', 'true');
    }
    function closeMenu() {
        menuOpen = false;
        qualityMenu.classList.remove('open'); qualityBtn.classList.remove('open');
        qualityBtn.setAttribute('aria-expanded', 'false');
    }
    qualityBtn.addEventListener('click', (e) => {
        e.stopPropagation();
        menuOpen ? closeMenu() : openMenu();
        showControls();
    });

    /* ══════════════════════ Показ/приховування панелі ══════════════════════ */
    function showControls() {
        controls.classList.add('visible');
        wrapper.classList.remove('hide-cursor');
        clearTimeout(uiTimer);
        if (!player.paused && !menuOpen && !hoverUI) {
            uiTimer = setTimeout(() => {
                if (!menuOpen && !player.paused && !hoverUI) {
                    controls.classList.remove('visible');
                    wrapper.classList.add('hide-cursor');
                }
            }, 5000);
        }
    }
    function hideControls() {
        if (menuOpen || player.paused || hoverUI) return;
        controls.classList.remove('visible');
        wrapper.classList.add('hide-cursor');
    }
    document.addEventListener('pointermove', (e) => {
        if (e.pointerType === 'mouse' && !justTouched) showControls();
    });
    document.addEventListener('mousemove', () => { if (!justTouched) showControls(); });
    controls.addEventListener('pointerenter', (e) => { if (e.pointerType === 'mouse') { hoverUI = true;  showControls(); } });
    controls.addEventListener('pointerleave', (e) => { if (e.pointerType === 'mouse') { hoverUI = false; showControls(); } });

    const isUiTarget = (t) => controls.contains(t) || qualityMenu.contains(t)
        || errorOv.contains(t) || t.closest?.('#ver-badge, #dbg-panel');

    /* Миша: клік = пауза/відтворення, подвійний клік = fullscreen */
    wrapper.addEventListener('click', (e) => {
        if (isUiTarget(e.target)) return;
        if (menuOpen) { closeMenu(); return; }
        if (justTouched) return;
        togglePlay();
        showControls();
    });
    wrapper.addEventListener('dblclick', (e) => {
        if (justTouched || isUiTarget(e.target)) return;
        toggleFs();
        showControls();
    });

    /* Тач: тап = показати/сховати, подвійний тап = ±10 сек */
    let tapTimer = null, tapCount = 0, tapSide = null;
    wrapper.addEventListener('touchend', (e) => {
        justTouched = true;
        setTimeout(() => { justTouched = false; }, 600);
        if (isUiTarget(e.target)) return;
        if (menuOpen) { closeMenu(); return; }
        const x = e.changedTouches[0].clientX;
        const side = x < wrapper.clientWidth / 2 ? 'L' : 'R';
        if (tapSide !== side) tapCount = 0;
        tapSide = side;
        tapCount++;
        clearTimeout(tapTimer);
        tapTimer = setTimeout(() => {
            if (tapCount === 1) controls.classList.contains('visible') ? hideControls() : showControls();
            else skipBy(side === 'L' ? -10 : 10);
            tapCount = 0;
        }, 250);
    });

    /* ══════════════════════ Клавіатура ══════════════════════ */
    function showKbHint(text) {
        kbHint.textContent = text;
        kbHint.classList.add('show');
        clearTimeout(kbHintTimer);
        kbHintTimer = setTimeout(() => kbHint.classList.remove('show'), 1800);
        showControls();
    }
    document.addEventListener('keydown', (e) => {
        if (e.target.tagName === 'INPUT' || e.ctrlKey || e.metaKey || e.altKey) return;
        switch (e.key) {
            case ' ': case 'k': case 'K': case 'л': case 'Л':
                e.preventDefault(); togglePlay(); showControls(); break;
            case 'ArrowLeft': case 'j': case 'J': case 'о': case 'О':
                e.preventDefault(); skipBy(-10); showKbHint('← −10 сек'); break;
            case 'ArrowRight': case 'l': case 'L': case 'д': case 'Д':
                e.preventDefault(); skipBy(+10); showKbHint('→ +10 сек'); break;
            case 'ArrowUp':
                e.preventDefault();
                player.volume = Math.min(1, +(player.volume + 0.1).toFixed(2));
                player.muted = false;
                showKbHint('↑ ' + Math.round(player.volume * 100) + '%'); break;
            case 'ArrowDown':
                e.preventDefault();
                player.volume = Math.max(0, +(player.volume - 0.1).toFixed(2));
                player.muted = player.volume === 0;
                showKbHint('↓ ' + Math.round(player.volume * 100) + '%'); break;
            case 'm': case 'M': case 'ь': case 'Ь':
                e.preventDefault(); player.muted = !player.muted;
                showKbHint(player.muted ? 'Звук вимкнено' : 'Звук увімкнено'); break;
            case 'f': case 'F': case 'а': case 'А':
                if (e.repeat) return;        // утримання клавіші не «блимає» fullscreen
                e.preventDefault(); toggleFs(); break;
            case 'Escape':
                closeMenu(); break;
        }
    });

    /* ══════════════════════ Fullscreen ══════════════════════
       Режим обирається один раз (fsMode):
         tg      — Telegram Bot API 8.0+: tg.requestFullscreen() (єдине, що
                   реально збільшує вікно міні-апки);
         element — звичайний браузер: wrapper.requestFullscreen();
         video   — старий Telegram/Safari на iPhone: системний плеєр iOS.
       Поки Telegram обробляє запит (асинхронно), повторні натискання
       ігноруються — раніше подвійне спрацювання й давало «через раз». */
    function setFsBusy() {
        fsBusy = true;
        clearTimeout(fsBusyTimer);
        fsBusyTimer = setTimeout(() => { fsBusy = false; syncFsIcon(); }, 1500);
    }
    function clearFsBusy() { fsBusy = false; clearTimeout(fsBusyTimer); }

    function isFs() {
        if (fsMode === 'video') return !!player.webkitDisplayingFullscreen;
        if (fsMode === 'tg') return !!tg.isFullscreen || !!fsElement();
        return !!fsElement();
    }
    function toggleFs() {
        userToggledFs = true;
        if (fsBusy) { dbg('fs: зайнято, пропускаю'); return; }
        // Випадковий подвійний клік/тап не повинен одразу скасувати перемикання.
        const now = Date.now();
        if (now - lastFsToggle < 600) { dbg('fs: надто швидко, пропускаю'); return; }
        lastFsToggle = now;
        isFs() ? exitFs() : enterFs(false);
    }

    function enterFs(isFallback) {
        fsWanted = true;
        dbg('enterFs mode=' + fsMode + (isFallback ? ' (fallback)' : ''));
        if (fsMode === 'tg') {
            try { setFsBusy(); tg.requestFullscreen(); return; }
            catch (e) {
                clearFsBusy();
                dbg('tg.requestFullscreen: ' + (e.message || e));
                fsMode = fallbackFsMode();
            }
        }
        if (fsMode === 'element') {
            const fn = wrapper.requestFullscreen || wrapper.webkitRequestFullscreen;
            setFsBusy();   // знімається у fullscreenchange
            try {
                const r = wrapper.requestFullscreen ? fn.call(wrapper, { navigationUI: 'hide' }) : fn.call(wrapper);
                if (r && r.then) r.then(lockLandscape, (e) => {
                    clearFsBusy();
                    dbg('element fs reject: ' + (e && e.message || e));
                    showKbHint(isFallback ? 'Натисніть ще раз для повного екрана' : 'Повний екран недоступний');
                });
                else lockLandscape();
            } catch (e) {
                clearFsBusy();
                dbg('element fs throw: ' + (e.message || e));
                showKbHint('Повний екран недоступний');
            }
            return;
        }
        if (fsMode === 'video') {
            try { player.webkitEnterFullscreen(); }
            catch (e) { dbg('webkitEnterFullscreen: ' + (e.message || e)); showKbHint(isFallback ? 'Натисніть ще раз для повного екрана' : 'Повний екран недоступний'); }
            return;
        }
        showKbHint('Повний екран недоступний');
    }

    function exitFs() {
        fsWanted = false;
        dbg('exitFs mode=' + fsMode);
        if (player.webkitDisplayingFullscreen) {
            try { player.webkitExitFullscreen(); } catch {}
        }
        if (fsElement()) {
            const fn = document.exitFullscreen || document.webkitExitFullscreen;
            setFsBusy();
            try { const r = fn.call(document); if (r && r.catch) r.catch(() => clearFsBusy()); } catch { clearFsBusy(); }
        }
        if (fsMode === 'tg' && tg?.isFullscreen) {
            try { setFsBusy(); tg.exitFullscreen(); } catch (e) { clearFsBusy(); dbg('tg.exitFullscreen: ' + (e.message || e)); }
        }
        try { screen.orientation?.unlock?.(); } catch {}
    }

    // Телефон у браузері: у повноекранному режимі повертаємо в альбомну.
    function lockLandscape() {
        if (!matchMedia('(pointer: coarse)').matches) return;
        if (player.videoWidth && player.videoWidth < player.videoHeight) return;
        try { screen.orientation?.lock?.('landscape').catch(() => {}); } catch {}
    }

    function syncFsIcon() {
        btnFs.hidden = fsMode === 'none';
        const on = isFs();
        btnFs.innerHTML = on ? '<i class="ti ti-arrows-minimize"></i>' : '<i class="ti ti-arrows-maximize"></i>';
        btnFs.setAttribute('aria-label', on ? 'Вийти з повного екрана' : 'Повний екран');
    }
    btnFs.addEventListener('click', (e) => { e.stopPropagation(); toggleFs(); showControls(); });

    function onFsChange() {
        dbg('fsChange: element=' + !!fsElement() + ' video=' + !!player.webkitDisplayingFullscreen);
        if (fsMode !== 'tg' || !tg.isFullscreen) clearFsBusy();
        syncFsIcon();
        showControls();
    }
    document.addEventListener('fullscreenchange',       onFsChange);
    document.addEventListener('webkitfullscreenchange', onFsChange);
    player.addEventListener('webkitbeginfullscreen',    onFsChange);
    player.addEventListener('webkitendfullscreen',      onFsChange);

    /* ══════════════════════ Старт ══════════════════════ */
    player.volume = 0.15;
    updateVolIcon();
    syncFsIcon();

    verBadge.textContent = VERSION + ' · ' + (tgPlatform || 'browser') + ' ' + (tg?.version && inTg ? tg.version : '')
        + (useProxy ? ' · proxy' : '');
    verBadge.addEventListener('click', (e) => { e.stopPropagation(); verBadge.classList.remove('fade'); toggleDbg(); });
    setTimeout(() => verBadge.classList.add('fade'), 6000);

    const tParam = +new URLSearchParams(location.search).get('t') || 0;
    const resumeAt = tParam || readResume();
    loadVideo(Object.keys(qualities)[0], { time: resumeAt, resumeHint: resumeAt });
    showControls();
    dbg('init done');
})();
</script>
</body>
</html>
