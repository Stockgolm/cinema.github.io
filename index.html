<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Підключаємо Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
        video { width: 100%; height: 100%; outline: none; }
    </style>
</head>
<body>
    <video id="player" controls playsinline></video>
    
    <script>
        // 1. Розгортаємо шторку на висоту телефону
        Telegram.WebApp.expand(); 
        
        // 2. Автоматично викликаємо примусовий повний екран Telegram
        try {
            Telegram.WebApp.requestFullscreen();
        } catch (e) {
            console.log(e);
        }

        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('v');
        const player = document.getElementById('player');
        
        if (videoUrl) {
            player.src = videoUrl;
            
            // Встановлюємо гучність на 15% (від 0.0 до 1.0)
            player.volume = 0.15;
            
            // Пробуємо автоматично запустити відео
            player.play().catch((error) => {
                // Якщо браузер заблокує автозапуск через наявність звуку,
                // відео просто стане на паузу, і користувачу треба буде нажати плей в плеєрі
                console.log("Автозапуск заблоковано браузером:", error);
            });
        }
    </script>
</body>
</html>
