<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Підключаємо Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
        video { width: 100%; height: 100%; outline: none; }
    </style>
</head>
<body>
    <video id="player" controls autoplay playsinline></video>
        <script>
        // Розгортаємо шторку (для телефонів)
        Telegram.WebApp.expand(); 
        
        // Нова фішка Telegram: примусовий справжній повний екран!
        try {
            Telegram.WebApp.requestFullscreen();
        } catch (e) {
            console.log("Повний екран не підтримується в цій версії");
        }
        
        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('v');
        
        if (videoUrl) {
            document.getElementById('player').src = videoUrl;
        }
    </script>

</body>
</html>
