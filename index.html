<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <!-- Підключаємо Telegram Web App API -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <!-- Підключаємо HLS.js для підтримки відео на ПК -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
    <style>
        body, html { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; }
        video { width: 100%; height: 100%; outline: none; }
    </style>
</head>
<body>
    <video id="player" controls playsinline></video>
    
    <script>
        // Просто розгортаємо шторку, без агресивного авто-фулскріну
        Telegram.WebApp.expand(); 
        Telegram.WebApp.setHeaderColor('#000000');
        Telegram.WebApp.setBackgroundColor('#000000');

        const urlParams = new URLSearchParams(window.location.search);
        const videoUrl = urlParams.get('v');
        const player = document.getElementById('player');

        // Ловимо ФІЗИЧНЕ натискання на кнопку Повного Екрану в плеєрі
        const handleFullscreen = () => {
            // Якщо плеєр перейшов у повний екран
            if (document.fullscreenElement || document.webkitFullscreenElement) {
                // Передаємо команду Телеграму сховати свою панель!
                try {
                    Telegram.WebApp.requestFullscreen();
                } catch (e) {
                    console.log(e);
                }
            } else {
                // Якщо користувач вийшов з повного екрану - повертаємо панель Телеграму
                try {
                    Telegram.WebApp.exitFullscreen();
                } catch (e) {
                    console.log(e);
                }
            }
        };

        // Вішаємо слухачі на зміни повного екрану
        player.addEventListener('fullscreenchange', handleFullscreen);
        player.addEventListener('webkitfullscreenchange', handleFullscreen);
        
        if (videoUrl) {
            player.volume = 0.15;

            // Якщо браузер ПК і це m3u8 потік - використовуємо HLS.js
            if (videoUrl.includes('.m3u8') && Hls.isSupported()) {
                const hls = new Hls({ maxBufferLength: 30, maxMaxBufferLength: 600 });
                hls.loadSource(videoUrl);
                hls.attachMedia(player);
                hls.on(Hls.Events.MANIFEST_PARSED, function() {
                    player.play().catch(e => console.log(e));
                });
            } else {
                player.src = videoUrl;
                player.play().catch(e => console.log(e));
            }
        }
    </script>
</body>
</html>
